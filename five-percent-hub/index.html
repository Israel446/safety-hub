<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f151b" media="(prefers-color-scheme: dark)">
<title>Five Percent Safety Hub</title>
<meta name="description" content="Daily lessons for safety professionals: safety science, human behaviour and professional craft.">
<link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/newsreader-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fonts are bundled so the hub does not wait on Google Fonts over mobile data. SIL Open Font License, see fonts/. */
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/bricolage.woff2) format("woff2-variations"),url(fonts/bricolage.woff2) format("woff2")}
@font-face{font-family:"Newsreader";font-style:normal;font-display:swap;font-weight:400;src:url(fonts/newsreader-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Newsreader";font-style:normal;font-display:swap;font-weight:600;src:url(fonts/newsreader-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Newsreader";font-style:italic;font-display:swap;font-weight:400;src:url(fonts/newsreader-latin-400-italic.woff2) format("woff2")}

/* Layout idea: one phone-width column; hi-vis amber is the only accent; an ink panel marks the one thing to do next. */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --ink:#16202a; --muted:#56636f; --line:#d9dfe5; --line-strong:#b8c2cc;
  --accent:#f0b400; --accent-ink:#16202a; --accent-soft:#fdf1cc;
  --panel:#16202a; --panel-ink:#f4f6f8; --panel-muted:#b3bec9; --panel-line:#2e3b48;
  --t-safety:#865c00; --t-people:#0b6b65; --t-craft:#4048a8;
  --good:#1a7a43; --bad:#b0352a;
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  --r:10px; --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f151b; --surface:#17202a; --ink:#e8edf2; --muted:#9aa7b4; --line:#26323e; --line-strong:#3a4856;
    --accent:#f5bd1f; --accent-ink:#16202a; --accent-soft:#3a3218;
    --panel:#1f2c39; --panel-ink:#eef2f5; --panel-muted:#a9b6c3; --panel-line:#344454;
    --t-safety:#f0c04a; --t-people:#5cc9c1; --t-craft:#a3aaf5;
    --good:#5cc489; --bad:#f08a80; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--line-strong) transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.45;padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));caret-color:var(--accent)}
::selection{background:var(--accent);color:var(--accent-ink)}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 8px}
.mark{font-weight:800;font-size:20px;letter-spacing:-.02em;white-space:nowrap;text-decoration:none;display:flex;align-items:center;gap:6px}
.mark b{background:var(--accent);color:var(--accent-ink);padding:1px 6px;border-radius:5px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right;min-width:0}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--line-strong);flex:none}
.sync.ok i{background:var(--good)} .sync.err i{background:var(--bad)}

main{display:flex;flex-direction:column;gap:14px;padding:6px 0 24px}
h1{font-size:30px;line-height:1.1;letter-spacing:-.025em;margin:0;text-wrap:balance;font-weight:800}
h2{font-size:20px;line-height:1.2;letter-spacing:-.01em;margin:22px 0 2px;font-weight:700;text-wrap:balance;scroll-margin-top:64px}
h2.sm{font-size:15px;margin-top:14px;color:var(--muted);font-weight:600;letter-spacing:0}
h3,.h3{font-size:18px;line-height:1.25;margin:0;font-weight:700;text-wrap:balance;letter-spacing:0}
p{margin:0;text-wrap:pretty}
li{text-wrap:pretty}
.muted{color:var(--muted)} .small{font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);color:var(--panel-ink);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px -18px rgba(10,20,30,.55)}
.panel .meta{color:var(--panel-muted);font-size:13.5px}
.panel .h3{font-size:22px;letter-spacing:-.01em}
.panel .big{color:var(--panel-ink)}

.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid currentColor;line-height:1.5}
.chip.safety{color:var(--t-safety)} .chip.people{color:var(--t-people)} .chip.craft{color:var(--t-craft)}
.chip.plain{color:var(--muted)} .chip.done{color:var(--good)} .chip.fill{background:var(--accent-soft);border-color:transparent;color:var(--ink)}

button,.btn{font:inherit;font-weight:650;font-size:15.5px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:0 16px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background-color .15s ease,border-color .15s ease,transform .1s ease}
button:hover,.btn:hover{border-color:var(--ink)}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover,.btn.primary:hover{background:#ffc61a;border-color:#ffc61a}
button.link{border:0;background:none;padding:0 2px;min-height:36px;text-decoration:underline;color:var(--muted);font-weight:500}
button:disabled{opacity:.55;cursor:default;border-color:var(--line)}
button:active:not(:disabled),.btn:active{transform:translateY(1px)}
:focus-visible{outline:3px solid var(--t-craft);outline-offset:2px;border-radius:6px}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;min-height:52px}
.item:first-child{border-top:0}
a.item:hover .t{text-decoration:underline}
.item .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.item .t{font-weight:600}
.num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px;flex:none}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);flex:none;display:flex;align-items:center;justify-content:center}
.tick.on{background:var(--good);border-color:var(--good)}
.tick.on::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}

.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar > span{display:block;height:100%;background:var(--accent);border-radius:999px}

/* today */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.week i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-strong);display:block}
.week .on i{background:var(--accent);border-color:var(--accent)}
.week .now{color:var(--ink)} .week .now i{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.line-stats{display:flex;gap:18px;flex-wrap:wrap;font-size:14.5px;color:var(--muted)}
.line-stats b{color:var(--ink);font-variant-numeric:tabular-nums}

/* reading */
.prose{font-family:var(--body);font-size:19px;line-height:1.6;display:flex;flex-direction:column;gap:14px;max-width:65ch}
.prose b{font-weight:600}
.big{font-family:var(--body);font-size:22px;line-height:1.42}
.idea{font-family:var(--body);font-size:24px;line-height:1.38;letter-spacing:-.005em;padding:18px 0 4px;border-top:2px solid var(--ink);max-width:30ch}
.ev{border:1px dashed var(--line-strong);border-radius:8px;padding:10px 12px;font-family:var(--display);font-size:14.5px;line-height:1.5}
.tech{display:flex;flex-direction:column;gap:14px}
.tech div b{display:block;margin-bottom:2px}
ol.q, ul.src, ul.pts{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
ul.src{font-size:14px;color:var(--muted)}

/* lesson section bar */
.secbar{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:0 16px;border-bottom:1px solid var(--line)}
.secbar .chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px 0}
.secbar .chips::-webkit-scrollbar{display:none}
.secbar button{min-height:34px;font-size:13.5px;font-weight:600;padding:0 11px;border-radius:999px;border-color:transparent;background:none;color:var(--muted);flex:none}
.secbar button:hover{color:var(--ink);border-color:transparent;background:var(--surface)}
.secbar button.on{background:var(--ink);color:var(--bg)}
.secbar .prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0}

/* visual system */
figure.sys{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
figure.sys .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
figure.sys .nm{font-size:21px;font-weight:800;letter-spacing:-.015em}
figure.sys svg{width:100%;height:auto;display:block;max-width:440px;margin:0 auto}
figure.sys figcaption{font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.sys-box{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.sys-box.c{fill:var(--accent-soft);stroke:var(--ink)}
.sys-hid{fill:none;stroke:var(--line-strong);stroke-width:1.5;stroke-dasharray:5 4}
.sys-txt{fill:var(--ink);font-family:var(--display);font-size:13.5px;font-weight:600}
.sys-txt.c{font-size:14.5px;font-weight:800}
.sys-q{fill:var(--muted);font-family:var(--display);font-size:16px;font-weight:700}
.sys-num{fill:var(--accent);stroke:var(--ink);stroke-width:1.5}
.sys-numt{fill:var(--accent-ink);font-family:var(--display);font-size:12.5px;font-weight:800}
.sys-ln{stroke:var(--ink);stroke-width:1.5;fill:none}
.sys-ln.soft{stroke:var(--line-strong)}
.sys-ring{stroke:var(--accent);stroke-width:4;fill:none}
.sys-head{fill:var(--ink)}
.sys-headring{fill:var(--accent)}

/* quiz */
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
legend{font-weight:650;padding:0;margin-bottom:6px;line-height:1.35}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer;min-height:44px;transition:border-color .15s ease,background-color .15s ease}
label.opt:hover{border-color:var(--line-strong)}
label.opt input{accent-color:var(--ink);margin-top:3px;flex:none}
label.opt:has(input:checked){border-color:var(--ink)}
label.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 9%,transparent)}
label.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.why{font-size:14.5px;color:var(--muted)}
.score{font-size:17px;font-weight:700}

label.f{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
textarea,input[type=text],input[type=email],input[type=password]{font:inherit;font-size:16px;width:100%;border:1px solid var(--line-strong);border-radius:9px;background:var(--bg);color:var(--ink);padding:11px 12px;min-height:44px}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.msgline{font-size:14px;min-height:1.2em}
.msgline.err{color:var(--bad)} .msgline.ok{color:var(--good)}
.initial{width:34px;height:34px;border-radius:50%;flex:none;background:var(--accent-soft);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}

details.wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.wk > summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:12px;min-height:56px}
details.wk > summary::-webkit-details-marker{display:none}
details.wk > summary .grow{flex:1}
details.wk > summary .chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s ease;flex:none;margin-right:4px}
details.wk[open] > summary .chev{transform:rotate(-135deg)}
details.wk .list{padding:0 16px 6px}
.wkbar{width:64px}

table.map{width:100%;border-collapse:collapse;font-size:14px}
table.map td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
table.map td:first-child{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
.scroll{overflow-x:auto}

/* teaching edition */
.slide{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;break-inside:avoid}
.slide .sn{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.slide .h3{font-size:24px;font-weight:800;letter-spacing:-.015em}
.slide .sb{font-size:18px;display:flex;flex-direction:column;gap:10px}
.notes{border-top:1px dashed var(--line-strong);padding-top:12px;font-size:15px;color:var(--muted);display:flex;flex-direction:column;gap:7px}
.notes b{color:var(--ink)}
.hide-notes .notes{display:none}
.slide figure.sys{border:0;padding:0;background:none}
.print-only{display:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-weight:600;font-size:12px;color:var(--muted);position:relative}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a.on{color:var(--ink)}
nav.tabs a.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs .badge[hidden]{display:none}
nav.tabs .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}

@media (min-width:720px){ h1{font-size:36px} .idea{font-size:27px} }
@media (prefers-reduced-motion:reduce){ *{transition:none !important;scroll-behavior:auto !important} }
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#333;--line:#bbb;--line-strong:#999;--accent-soft:#fff3c4;color-scheme:light}
  nav.tabs,.sync,.noprint,.secbar{display:none !important}
  .print-only{display:block}
  body{padding:0} .wrap{max-width:none}
}
</style>
</head>

<script>
(function(){
"use strict";
var L = window.LESSONS || [], C = window.CURRICULUM || {}, T = window.TEACH || {}, SYS = window.SYSTEMS || {}, CFG = window.HUB_CONFIG || {};
var byId = {}; L.forEach(function(l){ byId[l.id] = l; });
/* Quiz options are shuffled once, the same way on every device, so the right answer is not always in the same position. */
L.forEach(function(l){ l.quiz.forEach(function(q,i){
  var s=0, key=l.id+":"+i, k, j, r, t, idx=q.options.map(function(_,n){return n;}), correct=q.options[q.answer];
  for(k=0;k<key.length;k++) s=(s*31+key.charCodeAt(k))>>>0;
  for(j=idx.length-1;j>0;j--){ s=(Math.imul(s,1664525)+1013904223)>>>0; r=(s>>>8)%(j+1); t=idx[j]; idx[j]=idx[r]; idx[r]=t; }
  q.options=idx.map(function(n){return q.options[n];}); q.answer=q.options.indexOf(correct);
}); });
var TRACK = {safety:"Safety science", people:"People", craft:"Craft"};
var SHAPE = {steps:"Steps: the order matters", loop:"Loop: the end feeds the start", map:"Map: the parts affect each other"};
var DAY = 86400000, INTERVALS = [1,7,30];
var $view = document.getElementById("view"), $sync = document.getElementById("sync"), $badge = document.getElementById("rv-badge");

var sb = null;
try{ if(CFG.supabaseUrl && CFG.supabaseKey && window.supabase){ sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey); } }catch(e){ sb = null; }

/* ---------- state ---------- */
function blank(){ return {done:{}, quiz:{}, work:{}, days:[], rev:{}}; }
function loadLocal(){ try{ return Object.assign(blank(), JSON.parse(localStorage.getItem("fp-state")||"{}")); }catch(e){ return blank(); } }
function saveLocal(){ try{ localStorage.setItem("fp-state", JSON.stringify(S)); }catch(e){} }
var S = loadLocal(); if(!S.rev || typeof S.rev!=="object") S.rev={};
seedReviews();
var uid=null, profile=null, recovering=false, authMode="signin", authMsg=null;
var members=null, membersAt=0, hub={}, subCache={}, quizShown={}, teamScope="org", pending=false, writeChain=Promise.resolve(), syncErr=false, revColumn=true;
var reveal={}, recallOpen={};

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayOffset(n){ var d=new Date(); d.setDate(d.getDate()-n); return ymd(d); }
function streakOf(days){ var set={}; (days||[]).forEach(function(x){set[x]=1;}); var n=0, i=set[dayOffset(0)]?0:1; while(set[dayOffset(i)]){ n++; i++; } return n; }
function doneCount(done){ return L.filter(function(l){ return done && done[l.id]; }).length; }
function nextLesson(){ for(var i=0;i<L.length;i++){ if(!S.done[L[i].id]) return L[i]; } return null; }
function ago(ts){ if(!ts) return "not yet"; var d=Math.floor((Date.now()-ts)/DAY); return d<=0?"today":d===1?"yesterday":d+" days ago"; }
function inDays(ts){ var d=Math.ceil((ts-Date.now())/DAY); return d<=0?"today":d===1?"tomorrow":"in "+d+" days"; }
function norm(s){ return String(s||"").trim().toLowerCase(); }
function isAdmin(){ return !!(profile && profile.is_admin); }
function markActive(){ var t=dayOffset(0); if(S.days.indexOf(t)<0) S.days.push(t); }

/* ---------- review queue: back after 1 day, 1 week, 1 month ---------- */
function seedReviews(){ Object.keys(S.done).forEach(function(id){ if(byId[id] && !S.rev[id]) S.rev[id]={s:0, due:(S.done[id]||Date.now())+DAY}; }); }
function dueList(){ var now=Date.now(); return L.filter(function(l){ var r=S.rev[l.id]; return r && r.s<3 && r.due<=now; }).sort(function(a,b){ return S.rev[a.id].due-S.rev[b.id].due; }); }
function nextDue(){ var best=null; L.forEach(function(l){ var r=S.rev[l.id]; if(r && r.s<3 && r.due>Date.now() && (!best || r.due<best.due)) best={l:l, due:r.due}; }); return best; }
function mastered(){ return L.filter(function(l){ var r=S.rev[l.id]; return r && r.s>=3; }).length; }
function stageLabel(r){ return !r ? "" : r.s>=3 ? "Mastered" : ["First review","One-week review","One-month review"][r.s]; }
function finishReview(id, score, total){
  var r=S.rev[id]||{s:0,due:0}, pass = score >= Math.ceil(total*2/3);
  if(pass){ r.s=Math.min(3,r.s+1); r.due = r.s<3 ? Date.now()+INTERVALS[r.s]*DAY : null; }
  else { r.s=0; r.due=Date.now()+DAY; }
  r.last=Date.now(); S.rev[id]=r; markActive(); commit(); return pass;
}
function paintBadge(){ var n=dueList().length; $badge.hidden=!n; $badge.textContent=n>9?"9+":String(n); }

/* ---------- sync ---------- */
function merge(r){
  var changed=false; r=r||{};
  Object.keys(r.done||{}).forEach(function(k){ if(!S.done[k]){ S.done[k]=r.done[k]; changed=true; } });
  Object.keys(r.quiz||{}).forEach(function(k){ if(S.quiz[k]==null || r.quiz[k]>S.quiz[k]){ S.quiz[k]=r.quiz[k]; changed=true; } });
  Object.keys(r.reviews||{}).forEach(function(k){ var a=S.rev[k], b=r.reviews[k]; if(b && (!a || (b.last||0)>(a.last||0))){ S.rev[k]=b; changed=true; } });
  var set={}; S.days.concat(Array.isArray(r.days)?r.days:[]).forEach(function(d){ set[d]=1; });
  var days=Object.keys(set).sort(); if(days.length!==S.days.length){ S.days=days; changed=true; }
  seedReviews();
  return changed;
}
function localAhead(r){ r=r||{}; var rv=r.reviews||{};
  return Object.keys(S.done).some(function(k){return !(r.done||{})[k];}) || Object.keys(S.quiz).some(function(k){return (r.quiz||{})[k]!==S.quiz[k];}) ||
    Object.keys(S.rev).some(function(k){ return !rv[k] || (S.rev[k].last||0)>(rv[k].last||0); }); }
function pushRemote(){
  if(!sb || !uid || pending) return;
  pending=true;
  setTimeout(function(){
    pending=false; if(!uid) return;
    var row={user_id:uid, done:S.done, quiz:S.quiz, days:S.days.slice(-120), updated_at:new Date().toISOString()};
    if(revColumn) row.reviews=S.rev;
    writeChain=writeChain.then(function(){ return sb.from("progress").upsert(row); })
      .then(function(r){
        if(r && r.error && revColumn && /reviews/i.test(r.error.message||"")){ revColumn=false; return sb.from("progress").upsert((delete row.reviews, row)); }
        return r;
      })
      .then(function(r){ syncErr=!!(r&&r.error); paintSync(); })
      .catch(function(){ syncErr=true; paintSync(); });
  },700);
}
function paintSync(){
  var txt = !sb ? "Saved on this device" : !uid ? "Not signed in" : syncErr ? "Not synced, saved here" : "Synced";
  $sync.className = "sync" + (sb && uid ? (syncErr?" err":" ok") : "");
  $sync.querySelector("span").textContent = txt;
}
function commit(){ saveLocal(); pushRemote(); paintBadge(); }

/* ---------- account ---------- */
function onSession(session){
  var newUid = session && session.user ? session.user.id : null;
  if(newUid===uid) return;
  uid=newUid; profile=null; members=null; subCache={}; hub={};
  if(!uid){ render(); return; }
  loadProfile(0);
  sb.from("progress").select("*").eq("user_id",uid).maybeSingle().then(function(r){
    var row=r&&r.data; if(row && !("reviews" in row)) revColumn=false;
    var changed=merge(row);
    if(changed){ saveLocal(); softRender(); }
    if(!row || localAhead(row)) pushRemote();
  });
  sb.from("settings").select("value").eq("key","team").maybeSingle().then(function(r){ hub=(r&&r.data&&r.data.value)||{}; softRender(); });
}
function loadProfile(tries){
  sb.from("profiles").select("id,display_name,org,is_admin").eq("id",uid).maybeSingle().then(function(r){
    if(r && r.data){ profile=r.data; teamScope = norm(profile.org) ? "org" : "all"; softRender(); paintSync(); }
    else if(tries<3){ setTimeout(function(){ if(uid) loadProfile(tries+1); }, 1200); }
  });
}

/* ---------- visual systems ---------- */
var svgN=0;
function wrapText(text, max){
  var words=String(text).split(/\s+/), lines=[], cur="";
  words.forEach(function(w){ if(!cur) cur=w; else if((cur+" "+w).length<=max) cur+=" "+w; else { lines.push(cur); cur=w; } });
  if(cur) lines.push(cur); return lines;
}
function tspans(lines, x, y, lh){ return lines.map(function(t,i){ return '<tspan x="'+x+'" y="'+(y+i*lh)+'">'+esc(t)+'</tspan>'; }).join(""); }
function nodeBox(cx, cy, w, label, shown, max, cls){
  var lines=wrapText(label, max), h=Math.max(38, 18+lines.length*17), x=cx-w/2, y=cy-h/2;
  if(!shown) return '<rect class="sys-hid" x="'+x+'" y="'+(cy-19)+'" width="'+w+'" height="38" rx="9"/><text class="sys-q" x="'+cx+'" y="'+(cy+6)+'" text-anchor="middle">?</text>';
  return '<rect class="sys-box'+(cls?" "+cls:"")+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="9"/>'+
    '<text class="sys-txt'+(cls?" "+cls:"")+'" text-anchor="middle">'+tspans(lines, cx, cy-(lines.length-1)*8.5+5, 17)+'</text>';
}
function sysSvg(sys, shownCount){
  var n=sys.parts.length, shown=function(i){ return shownCount==null || i<shownCount; }, id="ah"+(++svgN), out="", W=340, H;
  var defs='<defs><marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sys-head" d="M0 0L10 5L0 10z"/></marker></defs>';
  if(sys.shape==="steps"){
    var y=8, gap=22;
    sys.parts.forEach(function(p,i){
      var lines=wrapText(p, 30), h=shown(i)?Math.max(40,18+lines.length*17):40, cy=y+h/2;
      out+='<circle class="sys-num" cx="18" cy="'+cy+'" r="13"/><text class="sys-numt" x="18" y="'+(cy+4.5)+'" text-anchor="middle">'+(i+1)+'</text>';
      out+=shown(i) ? '<rect class="sys-box" x="42" y="'+y+'" width="290" height="'+h+'" rx="9"/><text class="sys-txt" text-anchor="start">'+tspans(lines, 56, cy-(lines.length-1)*8.5+5, 17)+'</text>'
                    : '<rect class="sys-hid" x="42" y="'+y+'" width="290" height="40" rx="9"/><text class="sys-q" x="187" y="'+(cy+6)+'" text-anchor="middle">?</text>';
      if(i<n-1) out+='<line class="sys-ln" x1="187" y1="'+(y+h+2)+'" x2="187" y2="'+(y+h+gap-3)+'" marker-end="url(#'+id+')"/>';
      y+=h+gap;
    });
    H=y-gap+8;
  } else if(sys.shape==="loop"){
    W=384; var cx=192, cy=172, R=116; H=344;
    out+='<circle class="sys-ring" cx="'+cx+'" cy="'+cy+'" r="'+R+'"/>';
    for(var i=0;i<n;i++){
      var a=-Math.PI/2+(i+.5)*2*Math.PI/n, ax=cx+R*Math.cos(a), ay=cy+R*Math.sin(a), deg=a*180/Math.PI+90;
      out+='<path class="sys-headring" transform="translate('+ax.toFixed(1)+' '+ay.toFixed(1)+') rotate('+deg.toFixed(1)+')" d="M-6 -7L7 0L-6 7z"/>';
    }
    sys.parts.forEach(function(p,i){ var a=-Math.PI/2+i*2*Math.PI/n; out+=nodeBox(cx+R*Math.cos(a), cy+R*Math.sin(a), 120, p, shown(i), 15); });
  } else {
    W=392; var mx=196, my=176, MR=124; H=352;
    sys.parts.forEach(function(p,i){ var a=-Math.PI/2+i*2*Math.PI/n, b=-Math.PI/2+((i+1)%n)*2*Math.PI/n;
      if(n>3) out+='<line class="sys-ln soft" x1="'+(mx+MR*Math.cos(a)).toFixed(1)+'" y1="'+(my+MR*Math.sin(a)).toFixed(1)+'" x2="'+(mx+MR*Math.cos(b)).toFixed(1)+'" y2="'+(my+MR*Math.sin(b)).toFixed(1)+'"/>';
      out+='<line class="sys-ln" x1="'+mx+'" y1="'+my+'" x2="'+(mx+MR*Math.cos(a)).toFixed(1)+'" y2="'+(my+MR*Math.sin(a)).toFixed(1)+'"/>'; });
    out+=nodeBox(mx, my, 120, sys.name, true, 14, "c");
    sys.parts.forEach(function(p,i){ var a=-Math.PI/2+i*2*Math.PI/n; out+=nodeBox(mx+MR*Math.cos(a), my+MR*Math.sin(a), 118, p, shown(i), 15); });
  }
  var desc=sys.name+". "+SHAPE[sys.shape]+". "+sys.parts.map(function(p,i){return (i+1)+": "+p;}).join("; ");
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(desc)+'">'+defs+out+'</svg>';
}
function sysFigure(l, opts){
  var s=SYS[l.id]; if(!s) return ""; opts=opts||{};
  return '<figure class="sys"'+(opts.id?' id="'+opts.id+'"':'')+'><div class="hd"><span class="nm">'+esc(s.name)+'</span><span class="small muted">'+esc(SHAPE[s.shape])+'</span></div>'+
    sysSvg(s, opts.shown)+
    (opts.bare?'':'<figcaption><span>'+esc(s.note)+'</span><span class="small muted">'+esc(s.credit)+'</span></figcaption>')+'</figure>';
}

function weekStrip(){

function quizHtml(l, key){
  var shown=quizShown[key], h="";
  l.quiz.forEach(function(q,i){
    h+='<fieldset><legend>'+(i+1)+". "+esc(q.q)+'</legend>';
    q.options.forEach(function(o,j){
      var cls="opt", picked=shown && shown[i]===j, fid=key.replace(/[^a-z0-9]/gi,"")+"q"+i+"o"+j;
      if(shown){ if(j===q.answer) cls+=" right"; else if(picked) cls+=" wrong"; }
      h+='<label class="'+cls+'" for="'+fid+'"><input type="radio" id="'+fid+'" name="'+key+'-q'+i+'" value="'+j+'" '+(picked?"checked":"")+' '+(shown?"disabled":"")+'><span>'+esc(o)+'</span></label>';
    });
    if(shown) h+='<div class="why">'+(shown[i]===q.answer?"Correct. ":"The answer is "+esc(q.options[q.answer])+". ")+esc(q.why)+'</div>';
    h+='</fieldset>';
  });
  var isRev=key.indexOf("rv:")===0;
  if(shown){
    var sc=l.quiz.filter(function(q,i){return shown[i]===q.answer;}).length;
    h+='<div class="row"><span class="score">'+sc+' of '+l.quiz.length+' correct</span>'+(isRev?'':'<button data-act="quiz-retry" data-key="'+key+'">Try again</button>')+'</div>';
  } else {
    h+='<div class="row"><button class="'+(isRev?"primary":"")+'" data-act="quiz-check" data-key="'+key+'">Check answers</button>'+(!isRev&&S.quiz[l.id]!=null?'<span class="small muted">Best so far: '+S.quiz[l.id]+' of '+l.quiz.length+'</span>':'')+'<span class="small muted" id="quiz-msg" role="alert"></span></div>';
  }
  return h;
}

/* ---------- review ---------- */
function viewReview(){
  var due=dueList(), nd=nextDue(), h='<h1>Review</h1><p class="muted">Finished lessons come back after a day, a week and a month. Each review takes about two minutes: recall the system, then answer three questions.</p>';
  if(due.length){
    h+='<section class="card"><div class="list">'+due.map(function(l){ var r=S.rev[l.id];
      return '<a class="item" href="#rv-'+l.id+'"><span class="initial" aria-hidden="true">'+(r.s+1)+'</span><span class="grow"><span class="t">'+esc(l.title)+'</span><br><span class="small muted">'+stageLabel(r)+' · '+esc((SYS[l.id]||{}).name||"")+'</span></span><span class="num">Start</span></a>'; }).join("")+'</div></section>';

  } else if(act==="reveal-next" && idv){
    reveal[idv]=Math.min(SYS[idv].parts.length,(reveal[idv]||0)+1); document.getElementById("teach-sys").outerHTML=teachSysBody(byId[idv]);
  } else if(act==="reveal-all" && idv){
    reveal[idv]=SYS[idv].parts.length; document.getElementById("teach-sys").outerHTML=teachSysBody(byId[idv]);
  } else if(act==="reveal-reset" && idv){
    reveal[idv]=0; document.getElementById("teach-sys").outerHTML=teachSysBody(byId[idv]);
  } else if(act==="save-work" && l){
    var text=val("work").slice(0,1200), msg=document.getElementById("work-msg");
    if(!text){ msg.textContent="Write a few lines first."; return; }
    S.work[l.id]={text:text, ts:Date.now()}; saveLocal(); msg.textContent="Saved on this device";
    if(sb && uid){
      sb.from("work").upsert({user_id:uid, lesson_id:l.id, body:text, updated_at:new Date().toISOString()}).then(function(res){
        msg.textContent = res && res.error ? "Saved on this device. It could not be shared." : "Saved and shared with other members"; delete subCache[l.id];
      });
    }
  } else if(act==="set-team" && l && sb && isAdmin()){
    var tm=document.getElementById("team-msg"), value={lesson:l.id, org:(profile&&profile.org)||""};
    sb.from("settings").upsert({key:"team", value:value, updated_at:new Date().toISOString()}).then(function(res){
      if(res && res.error){ tm.textContent="Could not save. Try again."; } else { hub=value; tm.textContent="Set as the next team session"; }
    });
  } else if(act==="print"){
    window.print();
  } else if(act==="toggle-notes"){
    var box=document.getElementById("slides"), hidden=box.classList.toggle("hide-notes"); b.textContent = hidden ? "Show teacher notes" : "Hide teacher notes";
  } else if(act==="scope"){
    teamScope=b.getAttribute("data-scope"); render();
  } else if(act==="team-refresh"){
    members=null; subCache={}; render(); loadTeam(true);
  } else if(act==="auth-toggle"){
    authMode = authMode==="signup" ? "signin" : "signup"; authMsg=null; render();
  } else if(act==="auth-submit" && sb){
    var email=val("au-email"), pass=document.getElementById("au-pass").value;
    if(!email || !pass){ setAuthMsg("Enter your email and password.","err"); return; }
    if(authMode==="signup"){
      var name=val("au-name"), org=val("au-org");
      if(!name){ setAuthMsg("Enter your name.","err"); return; }
      if(pass.length<8){ setAuthMsg("Use a password of 8 characters or more.","err"); return; }
      setAuthMsg("Creating your account…");
      sb.auth.signUp({email:email, password:pass, options:{data:{full_name:name, org:org}, emailRedirectTo:redirectUrl()}}).then(function(res){
        if(res.error){ setAuthMsg(res.error.message,"err"); }
        else if(!res.data.session){ setAuthMsg("Check your email and open the confirmation link to finish.","ok"); }
      });
    } else {
      setAuthMsg("Signing in…");
      sb.auth.signInWithPassword({email:email, password:pass}).then(function(res){ if(res.error) setAuthMsg(res.error.message==="Invalid login credentials"?"Email or password is not correct.":res.error.message,"err"); });
    }
  } else if(act==="auth-google" && sb){
    sb.auth.signInWithOAuth({provider:"google", options:{redirectTo:redirectUrl()}}).then(function(res){ if(res.error) setAuthMsg(res.error.message,"err"); });
  } else if(act==="auth-reset" && sb){
    var em=val("au-email"); if(!em){ setAuthMsg("Type your email above first, then choose Forgot password.","err"); return; }
    sb.auth.resetPasswordForEmail(em,{redirectTo:redirectUrl()}).then(function(res){ setAuthMsg(res.error?res.error.message:"If that email has an account, a reset link is on its way.", res.error?"err":"ok"); });
  } else if(act==="set-password" && sb){
    var np=document.getElementById("np").value; if(np.length<8){ setAuthMsg("Use a password of 8 characters or more.","err"); return; }
    sb.auth.updateUser({password:np}).then(function(res){ if(res.error){ setAuthMsg(res.error.message,"err"); } else { recovering=false; render(); } });
  } else if(act==="save-profile" && sb && uid){
    var pm=document.getElementById("pf-msg"), nm=val("pf-name").slice(0,60), og=val("pf-org").slice(0,80);
    if(!nm){ pm.textContent="Enter a name."; return; }
    sb.from("profiles").update({display_name:nm, org:og}).eq("id",uid).then(function(res){
      if(res && res.error){ pm.textContent="Could not save. Try again."; } else { profile=Object.assign({},profile,{display_name:nm, org:og}); teamScope=norm(og)?"org":"all"; members=null; pm.textContent="Saved"; paintSync(); }
    });
  } else if(act==="signout" && sb){
    sb.auth.signOut();
  }
});

/* ---------- start ---------- */
saveLocal();
render();
if(sb){
  sb.auth.onAuthStateChange(function(event, session){
    if(event==="PASSWORD_RECOVERY"){ recovering=true; }
    setTimeout(function(){ onSession(session); if(event==="PASSWORD_RECOVERY"){ location.hash="#me"; render(); } }, 0);
  });
  sb.auth.getSession().then(function(r){ onSession(r && r.data ? r.data.session : null); });
}
})();
</script>
</body>
</html>
